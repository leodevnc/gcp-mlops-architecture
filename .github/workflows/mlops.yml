name: MLOps pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
          python-version: "3.12"
      - name: Verify training and pipeline components
        run: |
          uv sync --locked --group gcp
          uv run --locked --group gcp python -m unittest discover -s tests -v
          uv run --locked --group gcp python -m unittest discover -s tests/gcp -v
      - name: Build and verify the container
        run: |
          docker build --tag delivery-mlops:ci .
          docker run --rm --network none \
            --volume "$PWD/scripts/verify-image.sh:/checks/verify-image.sh:ro" \
            --volume "$PWD/data:/sample:ro" delivery-mlops:ci \
            sh /checks/verify-image.sh /sample/deliveries.csv

  release-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_RELEASE_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    concurrency:
      group: vertex-staging-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_DOCKER_REPO: ${{ vars.GCP_DOCKER_REPO }}
      GCP_KFP_REPO: ${{ vars.GCP_KFP_REPO }}
      GCP_SOURCE_URI: ${{ vars.GCP_SOURCE_URI }}
      GCP_PIPELINE_ROOT: ${{ vars.GCP_PIPELINE_ROOT }}
      GCP_PIPELINE_SA: ${{ vars.GCP_PIPELINE_SA }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
          python-version: "3.12"
      - name: Build and verify the release image
        id: build
        run: |
          : "${GCP_PROJECT:?}" "${GCP_REGION:?}" "${GCP_DOCKER_REPO:?}" \
            "${GCP_KFP_REPO:?}" "${GCP_SOURCE_URI:?}" "${GCP_PIPELINE_ROOT:?}" "${GCP_PIPELINE_SA:?}"
          tag="git-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$GCP_DOCKER_REPO/delivery-mlops:$tag"
          docker build --tag "$image" .
          docker run --rm --network none \
            --volume "$PWD/scripts/verify-image.sh:/checks/verify-image.sh:ro" \
            --volume "$PWD/data:/sample:ro" "$image" \
            sh /checks/verify-image.sh /sample/deliveries.csv
          printf 'image=%s\ntag=%s\n' "$image" "$tag" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Push the verified image
        id: image
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"
          digest_uri="$(gcloud artifacts docker images describe "$IMAGE" \
            --project "$GCP_PROJECT" --format='value(image_summary.fully_qualified_digest)')"
          printf 'uri=%s\n' "$digest_uri" >> "$GITHUB_OUTPUT"
      - name: Publish the pipeline definition
        id: template
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          repository="https://$GCP_REGION-kfp.pkg.dev/$GCP_PROJECT/$GCP_KFP_REPO"
          template_uri="$(uv run --locked --group gcp python -m mlops_demo.gcp publish \
            --image-uri "$IMAGE_URI" --repository "$repository" --tag "$RELEASE_TAG" \
            --output runs/level2/pipeline.yaml)"
          printf 'uri=%s\n' "$template_uri" >> "$GITHUB_OUTPUT"
      - name: Run the staging pipeline
        env:
          TEMPLATE_URI: ${{ steps.template.outputs.uri }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          uv run --locked --group gcp python -m mlops_demo.gcp submit \
            --template "$TEMPLATE_URI" --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --source-uri "$GCP_SOURCE_URI" --pipeline-root "$GCP_PIPELINE_ROOT" \
            --service-account "$GCP_PIPELINE_SA" --model-id delivery-time-staging \
            --max-mae 5 --wait --require-approved
          printf '### Validated staging release\n\n- Image: %s\n- Pipeline: %s\n' \
            "$IMAGE_URI" "$TEMPLATE_URI" >> "$GITHUB_STEP_SUMMARY"
