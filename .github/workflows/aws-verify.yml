name: AWS MLOps verification

on:
  pull_request:
    paths:
      - ".github/workflows/aws-verify.yml"
      - ".dockerignore"
      - "Dockerfile.aws"
      - "data/**"
      - "infra/aws/**"
      - "mlops_demo/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
          python-version: "3.12"
      - name: Verify AWS pipeline and model artifacts
        run: |
          uv sync --locked --group aws
          uv run --locked --group aws python -m unittest discover -s tests -v
          uv run --locked --group aws python -m unittest discover -s tests/aws -v
      - name: Validate the CloudFormation stack
        run: uvx --from cfn-lint==1.60.1 cfn-lint --regions us-east-1 ap-northeast-2 --template infra/aws/mlops.yaml
      - name: Build and verify the AWS container
        run: bash scripts/build-aws-worker.sh delivery-mlops-aws:ci
