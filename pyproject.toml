[project]
name = "gcp-mlops-architecture"
version = "0.1.0"
description = "A staged implementation of Google Cloud's MLOps reference architecture"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "scikit-learn==1.8.0",
    "uvicorn==0.52.1",
]

[dependency-groups]
dev = ["httpx2==2.16.0"]
aws = ["boto3==1.44.3"]
gcp = [
    "google-cloud-aiplatform==2.9.0",
    "google-cloud-storage==3.17.1",
    "kfp==2.18.0",
]
